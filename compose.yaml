services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - reports:/app/outputs/reports
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reports:
